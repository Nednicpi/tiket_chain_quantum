<!DOCTYPE html>
<html>
<head>

<title>TIKET CHAIN QUANTUM</title>
<style>
body { font-family: Arial; padding: 20px; text-align: center; }
button { padding: 10px 15px; margin: 5px; font-weight: bold; }
#ledger { margin-top: 20px; word-break: break-all; text-align: left; background: #f5f5f5; padding: 10px; }
</style>

<body>

<h1>TIKET CHAIN QUANTUM</h1>
<p>Backend: ledger.txt (GitHub Blockchain)</p>

<button onclick="claim()">CLAIM GRATIS</button>
<button onclick="transfer()">TRANSFER P2P</button>

<div id="ledger">Loading ledger...</div>

<script>
async function loadLedger() {
  let res = await fetch('https://raw.githubusercontent.com/nednicpi/tiket_chain_quantum/main/ledger.txt');
  let text = await res.text();
  document.getElementById('ledger').innerText = text.slice(-2000);
}
loadLedger();

function claim() { alert('Claim 6 tiket - Mining dimulai! Check transfer.py'); }
function transfer() { alert('Transfer P2P - Harga bebas Rp 0,000000000001'); }
</script>

</body>
