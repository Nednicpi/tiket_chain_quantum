<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BACKEND - TIKET CHAIN</title></head>
<body style="font-family:monospace;padding:20px;background:#111;color:#0f0">
<h3>🔗 BACKEND - ledger.txt LIVE</h3>
<pre id="log" style="background:#000;padding:15px;border-radius:10px;white-space:pre-wrap;max-height:80vh;overflow:auto">Loading...</pre>
<script>
async function load(){
let r=await fetch('https://raw.githubusercontent.com/Nednicpi/tiket_chain_quantum/main/ledger.txt?t='+Date.now());
let t=await r.text();
document.getElementById('log').innerText=t.slice(-5000);
}
load(); setInterval(load,5000);
</script>
</body>
</html>
